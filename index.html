<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <section class="card">
            <h1>Bem-vindo <span>de volta!</span></h1>
            <p>Faça login com suas informações para acessar seus trabalhos.</p>
                <form id="login" method="post" action="">
                    <div class="input">
                        <label for="user-name">Nome:</label>
                        <input type="text" name="user" id="user-name" required>
                    </div>
                    
                    <div class="input">
                        <label for="user-password">Senha:</label>
                        <input type="password" name="password" id="user-password" required>
                    </div>

                    <input type="submit" value="Enviar" class="btn-submit">
                </form>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
